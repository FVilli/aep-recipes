# Recipe: nestjs-trello-inference
# Layer deterministico — eseguito direttamente da AEP, non interpretato da un LLM.

description: >-
  Backend NestJS che integra Trello (board/card, webhook) con un provider di
  inferenza LLM con supporto tool calling (lettura card/board, web search,
  knowledge base). Adatto a progetti che combinano questi stessi tre elementi:
  NestJS, API Trello, un modello LLM invocato in modo agentico.

requiredPaths:
  - src/main.ts
  - package.json
  - package-lock.json
  - prisma/schema.prisma

checks:
  build: npm run build

inputs:
  - package.json
  - package-lock.json
  - prisma

outputs:
  - node_modules
  - node_modules/.prisma/client

prepare:
  - name: install-dependencies
    command: npm ci
    cwd: .
    timeoutMs: 600000
  - name: generate-prisma-client
    command: POSTGRES_URL=postgresql://aep:aep@127.0.0.1:5432/aep npx prisma generate
    cwd: .
    timeoutMs: 600000
